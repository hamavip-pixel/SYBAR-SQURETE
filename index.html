<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ماتریکس - دیزاینی ئاڵتوونی</title>
    <style>
        body {
            background-color: #0b0f19; /* ڕەنگی پشتەوەی تاریک و سەرنجڕاکێش */
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 400px;
            height: 400px;
        }

        /* نووسینی سەرەکی لە ناوەڕاستدا بە ڕەنگی ڕەش */
        .center-text {
            font-size: 2rem;
            font-weight: bold;
            color: #000000; /* تێکستی ڕەش */
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 12px;
        }

        /* بازنەی ئاڵتوونی درەوشاوەی دەورەوبەر */
        .gold-ring {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 6px solid transparent;
            border-top-color: #ffd700;
            border-bottom-color: #ffaa00;
            box-shadow: 0 0 25px #ffd700, inset 0 0 25px #ffaa00;
            animation: spinRing 4s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* شتەکان کە بەدەوری بازنەکەدا دەسوڕێنەوە */
        .orbit-container {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: spinOrbit 8s linear infinite;
        }

        .orbit-item {
            position: absolute;
            font-size: 1.8rem;
            /* ڕەنگکردنی ئایکۆنەکان بە ڕەش یان سێبەرکردن */
            filter: brightness(0); 
        }

        /* شوێنی ئایکۆنەکان لەسەر بازنەکە */
        .item-1 { top: 0; left: 50%; transform: translate(-50%, -50%); }
        .item-2 { bottom: 0; left: 50%; transform: translate(-50%, 50%); }
        .item-3 { top: 50%; left: 0; transform: translate(-50%, -50%); }
        .item-4 { top: 50%; right: 0; transform: translate(50%, -50%); }

        @keyframes spinOrbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- بازنەی ئاڵتوونی گەڕۆک -->
        <div class="gold-ring"></div>

        <!-- ئایکۆنە ڕەشەکان کە دەسوڕێنەوە -->
        <div class="orbit-container">
            <div class="orbit-item item-1">🚀</div>
            <div class="orbit-item item-2">💻</div>
            <div class="orbit-item item-3">⭐</div>
            <div class="orbit-item item-4">✨</div>
        </div>

        <!-- تێکستی سەرەکی ناوەڕاست بە ڕەنگی ڕەش -->
        <div class="center-text">فەقەت حەمە گیان، بەخێر بێیت!</div>
    </div>

</body>
</html>
